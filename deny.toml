# cargo-deny configuration (CI job "Supply chain").
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build unless it is listed here with a
# reason and the dependency path that brings it in.
ignore = [
  # proc-macro-error 1.0.4 is unmaintained (no vulnerability). It is a
  # build-time proc-macro dependency of the gtk-rs 0.18 bindings Tauri uses on
  # Linux only: glib-macros / gtk3-macros 0.18 -> glib / gtk 0.18 -> muda,
  # tao, webkit2gtk, wry -> tauri 2.12. No release of Tauri 2 moves off gtk-rs
  # 0.18, so there is no upgrade to take; drop this entry when one lands.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro in Tauri's Linux gtk-rs 0.18 tree (glib-macros, gtk3-macros); no upgrade available" },
]

[licenses]
# Permissive licenses compatible with distributing ow-tauri under MIT.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are common in the Tauri tree; report, do not fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
