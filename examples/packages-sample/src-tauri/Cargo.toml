# The Tauri app of the ported sample: a thin shell around
# tauri-plugin-overwolf. The app code itself runs in webviews (the main
# process in the hidden main webview, ADR 0001).
#
# A standalone Cargo workspace for now, with its own Cargo.lock; versions
# match the root `[workspace.dependencies]`.
[workspace]

[package]
name = "overwolf-official-sample-app"
description = "Overwolf's ow-electron packages sample, ported to Tauri 2 with ow-tauri."
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "overwolf-official-sample-app"
path = "src/main.rs"
test = false
doctest = false

[features]
# The end-to-end lab (`e2e/README.md`): the plugin's lab trace and invisible
# windows, the lab identity at run time and the driver's `e2e_record`
# command. Off by default; never enable it in a shipped build.
lab = ["tauri-plugin-overwolf/lab"]

[dependencies]
tauri = { version = "2.12.1", features = ["unstable"] }
tauri-plugin-single-instance = "2.5.2"
# `tauri::generate_context!` expands to `serde_json` calls for `plugins` config.
serde_json = "1"
tauri-plugin-overwolf = { path = "../../../crates/tauri-plugin-overwolf" }

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-overwolf = { path = "../../../crates/tauri-plugin-overwolf", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
