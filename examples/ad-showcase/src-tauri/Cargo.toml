# The ad showcase's Tauri shell: a thin app around tauri-plugin-overwolf. The
# app code (main process and window) is the same TypeScript the ow-electron
# build runs; the main process runs in the plugin's hidden main webview.
#
# A standalone Cargo workspace with its own Cargo.lock, like
# examples/packages-sample; versions match the root `[workspace.dependencies]`.
[workspace]

[package]
name = "ow-tauri-ad-showcase"
description = "Every Overwolf <owadview> ad format on ow-tauri, with the same app code as on ow-electron."
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "ow-tauri-ad-showcase"
path = "src/main.rs"
test = false
doctest = false

[features]
# The invisible lab (`e2e/README.md`): the plugin's lab trace and invisible
# windows, a lab manifest at run time and the driver's commands. Off by
# default; never enable it in a shipped build.
lab = ["tauri-plugin-overwolf/lab", "dep:objc2", "dep:block2", "dep:objc2-foundation"]

[dependencies]
tauri = { version = "2.12.1", features = ["unstable"] }
tauri-plugin-single-instance = "2.5.2"
# `tauri::generate_context!` expands to `serde_json` calls for `plugins` config.
serde_json = "1"
tauri-plugin-overwolf = { path = "../../../crates/tauri-plugin-overwolf" }

# The lab's native probes (src/lab/native.rs, macOS): hit test and
# in-process stills. Versions as in the plugin; only with the `lab` feature.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
block2 = { version = "0.6.2", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"], optional = true }

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-overwolf = { path = "../../../crates/tauri-plugin-overwolf", default-features = false }

[lints.rust]
missing_docs = "deny"
# Only the lab's native probes (src/lab/native.rs, feature `lab`) call
# Objective-C.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
