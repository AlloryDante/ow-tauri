[package]
name = "my-react-game-app"
version = "1.0.0"
description = "The React variant of the tauri-plugin-overwolf getting-started app."
authors = ["Example Studio"]
license = "MIT"
edition = "2021"
publish = false

# A standalone Cargo workspace (not part of the repository's), like an app
# created with `npm create tauri-app`.
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_react_game_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# In your app: `tauri-plugin-overwolf = "1"` (docs/GETTING-STARTED.md); here
# the repository's crate by path.
[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-overwolf = { path = "../../../crates/tauri-plugin-overwolf", default-features = false, features = ["build"] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-overwolf = { path = "../../../crates/tauri-plugin-overwolf" }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
