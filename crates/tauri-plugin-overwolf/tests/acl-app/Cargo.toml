# Mock-runtime test app for the plugin's permission sets and runtime
# capabilities (ARCHITECTURE 5.2). The ACL is compiled by tauri-build from the
# plugin's `permissions/` and `capabilities/` here, which the plugin crate's
# own tests cannot do. Never published, never run as a GUI app.
[package]
name = "ow-tauri-acl-tests"
description = "Mock-runtime ACL and IPC routing tests for tauri-plugin-overwolf."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
test = false
doctest = false

[dependencies]
tauri = { workspace = true, features = ["test", "unstable"] }
tauri-plugin-overwolf = { path = "../..", features = ["test-util"] }

[dev-dependencies]
serde_json = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
tauri-plugin-overwolf = { path = "../..", default-features = false }

[lints]
workspace = true
