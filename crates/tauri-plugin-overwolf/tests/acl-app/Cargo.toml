# Mock-runtime test app for the plugin's permission sets, runtime
# capabilities and caller gate (DESIGN §7.2). The ACL is compiled by
# tauri-build from the plugin's `permissions/` and the `capabilities/` here,
# which the plugin crate's own tests cannot do. Never published, never run
# as a GUI app. W1 keeps it minimal; the full suite returns in W3.
[package]
name = "ow-tauri-acl-tests"
description = "Mock-runtime ACL tests for tauri-plugin-overwolf."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
test = false
doctest = false

# Stands in for an NSIS installer in the update tests: records its
# arguments beside itself and exits.
[[bin]]
name = "fake-installer"
path = "src/bin/fake-installer.rs"
test = false
doctest = false

[features]
# The update client (Windows); `tests/updater.rs` drives it from a loopback
# feed.
updater = ["tauri-plugin-overwolf/updater"]

[dependencies]
tauri = { workspace = true, features = ["test"] }
tauri-plugin-overwolf = { path = "../..", features = ["test-util"] }
# `generate_context!` embeds `plugins.overwolf` as a `serde_json` value.
serde_json = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true
