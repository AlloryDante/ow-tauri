[package]
name = "tauri-plugin-overwolf"
description = "Tauri 2 plugin that hosts Overwolf ads, analytics, consent and packages for apps ported from ow-electron."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Tauri plugins declare `links` so tauri-build can find the permission files
# this crate's build script generates (DEP_TAURI_PLUGIN_OVERWOLF_*).
links = "tauri-plugin-overwolf"
# `js/` holds the generated runtime bundle (`npm run build:injected
# --workspace ow-tauri`); the published crate must carry it.
include = ["/build.rs", "/src/**", "/permissions/**", "/js/**", "/README.md"]

[features]
# `plugin` is the Tauri plugin itself. Without it the crate is only the
# manifest parser, the identity functions and the `build` helper, which is
# what an app's build script needs:
#   [build-dependencies]
#   tauri-plugin-overwolf = { version = "0.1", default-features = false }
default = ["plugin"]
plugin = [
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-global-shortcut",
  "dep:tokio",
  "dep:uuid",
  "dep:sys-locale",
  "dep:log",
  "dep:reqwest",
  "dep:hyper",
  "dep:hyper-util",
  "dep:hyper-tls",
  "dep:native-tls",
  "dep:http",
  "dep:http-body-util",
  "dep:bytes",
  "dep:tower-service",
  "dep:async-compression",
  "dep:objc2",
  "dep:objc2-foundation",
  "dep:block2",
  "dep:webview2-com",
  "dep:windows",
  "dep:webkit2gtk",
]
# Lets `window_devtools` open devtools in release builds (Tauri `devtools`).
devtools = ["plugin", "tauri/devtools"]
# Hooks for tests on Tauri's mock runtime (the plugin's own suite, and apps
# that test their IPC wiring): `Builder::skip_os_queries`, and hidden
# `Overwolf::test_*` methods that drive the window, navigation, page-load and
# exit-request handlers the mock runtime never fires. Not a stable API.
test-util = ["plugin"]
# The parity lab (tools/parity-harness/tauri-app): a trace of host requests,
# guest lifecycle, cookies and state writes, and invisible windows, both
# switched on at run time by OW_TAURI_LAB_DIR / OW_TAURI_LAB_INVISIBLE. Never
# enable it in a shipped app.
lab = ["plugin"]
# Lets `build::embed_manifest` compile and link the `OWEINTEGRITY/OWE` PE
# resource of a signed Windows release build (CONTRACT G.4 c). Enable it on
# the build-dependency.
embed-resource = ["dep:embed-resource"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
md5 = { workspace = true }
base64 = { workspace = true }
# WHATWG URL parsing for `shell_open_external` checks (pure, also in tests).
url = { workspace = true }
# The update client (CONTRACT I): electron-updater feed YAML, versions and
# the detached minisign signature. Pure Rust, no default features.
yaml-rust2 = { version = "0.13.0", default-features = false }
semver = { workspace = true }
minisign-verify = "0.3.0"
# Build-script only: compiles the OWEINTEGRITY/OWE resource script.
embed-resource = { version = "3.0.12", optional = true }

# `webview-data-url`: the consent settings window opens on a `data:`
# preloader, as in ow-electron (observed); Tauri refuses `data:` URLs without it.
tauri = { workspace = true, optional = true, features = ["unstable", "webview-data-url"] }
tauri-plugin-opener = { workspace = true, optional = true }
tauri-plugin-dialog = { workspace = true, optional = true }
# The update client (CONTRACT I).
reqwest = { workspace = true, optional = true, features = ["gzip", "deflate", "brotli", "zstd"] }
# Host analytics and the consent request (CONTRACT E.1): a plain hyper client,
# because reqwest always adds `accept: */*`, which ow-electron does not send.
# Every crate below is already in the tree through reqwest at these versions;
# TLS is the same native-tls stack with ALPN (HTTP/2), proxies come from the
# same system matcher reqwest uses.
hyper = { version = "1.11.1", optional = true, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", optional = true, features = ["client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "tokio"] }
hyper-tls = { version = "0.6.0", optional = true, features = ["alpn"] }
native-tls = { version = "0.2.18", optional = true, features = ["alpn"] }
http = { version = "1.5.0", optional = true }
http-body-util = { version = "0.1.5", optional = true }
bytes = { version = "1.12.1", optional = true }
tower-service = { version = "0.3.3", optional = true }
async-compression = { version = "0.4.48", optional = true, features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
tauri-plugin-global-shortcut = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["io-util"] }
uuid = { workspace = true, optional = true }
sys-locale = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Guest webview hooks (mute, request shaping, crash and load-failure
# reports, D.7, D.8.3): the versions Tauri 2.12's wry uses.
webview2-com = { version = "0.39.1", optional = true }
windows = { version = "0.62.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Guest mute, the shaped navigations (D.8.3) and the ads data store's
# cookies for host requests (E.1); wry's versions.
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSDate", "NSGeometry", "NSHTTPCookie", "NSString", "NSURL", "NSURLRequest"] }
block2 = { version = "0.6.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Guest mute, the shaped first navigation, crash and load-failure reports;
# wry's version and feature level.
webkit2gtk = { version = "=2.0.2", optional = true, features = ["v2_38"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tauri = { workspace = true, features = ["unstable", "test"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
