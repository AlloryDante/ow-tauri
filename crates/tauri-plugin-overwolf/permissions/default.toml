"$schema" = "schemas/schema.json"

# What an app webview needs to show ads and run the consent flow. Grant it to
# the app's own webviews by label (`"webviews": ["main"]`), never to a
# `windows` selector that could match a window hosting an ad (DESIGN §3.6).
[default]
description = "Overwolf ads (<owadview>), consent queries and the ad privacy settings window, read-only identity (no machine ids), naming the caller's window, and the switches that reduce what is sent."
permissions = [
  "allow-adview-mount",
  "allow-adview-update",
  "allow-adview-unmount",
  "allow-adview-command",
  "allow-set-window-name",
  "allow-get-info",
  "allow-is-cmp-required",
  "allow-open-ad-privacy-settings-window",
  "allow-open-cmp-window",
  "allow-disable-anonymous-analytics",
  "allow-disable-ads-optimization",
  "allow-disable-ads-fpd",
]
