"$schema" = "schemas/schema.json"

# Ad guests (`owad-*` child webviews) and the consent windows (`ow-cmp*`). The
# plugin adds both at runtime as remote capabilities limited to Overwolf's
# pages (see `capabilities.rs`); apps never grant them.
[[set]]
identifier = "adview-guest"
description = "The one command of an ad guest (`owad-*`) on https://www.overwolf.com/monsdk/electron/: `adview_event`."
permissions = ["allow-adview-event"]

[[set]]
identifier = "cmp-window"
description = "The one command of a consent window (`ow-cmp*`) on https://content.overwolf.com/monsdk/electron/: `cmp_event`."
permissions = ["allow-cmp-event"]
