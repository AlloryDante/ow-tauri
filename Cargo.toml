# ow-tauri Cargo workspace.
#
# Members: the plugin crate, its `unstable` helper crate and the plugin's
# mock-runtime ACL test app. The examples are separate Tauri projects.
[workspace]
resolver = "3"
members = [
  "crates/tauri-plugin-overwolf",
  "crates/tauri-plugin-overwolf-unstable",
  "crates/tauri-plugin-overwolf/tests/acl-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: the highest floor of our toolchain inputs. Edition 2024 needs 1.85 and
# tauri 2.12.1 declares `rust-version = "1.90"`. Development and the main CI
# jobs use Rust 1.98 (see rust-toolchain.toml); a scheduled CI job also runs
# the newest stable Rust.
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["ow-tauri contributors"]
description = "Overwolf ads, consent and analytics for Tauri 2 apps."
keywords = ["tauri", "overwolf", "plugin", "ads", "electron"]
categories = ["gui", "api-bindings"]

# Versions every lane must use. Latest stable as of 2026-10-06; see
# docs/adr/ and CONTRIBUTING.md for the upgrade policy. Members opt in with
# `foo = { workspace = true }`, so nothing here is resolved until used.
[workspace.dependencies]
# Supported range: 2.12.1 up to the newest 2.x (caret requirement). The
# plugin's `ads` feature enables Tauri's `unstable` feature on Windows and
# macOS only, through `tauri-plugin-overwolf-unstable` (child webviews);
# unstable APIs may change in a 2.x minor, so the scheduled CI job builds
# against the newest 2.x release (CONTRIBUTING.md).
tauri = { version = "2.12.1", default-features = true }
tauri-utils = { version = "2.10.1", default-features = false }
tauri-build = "2.7.1"
tauri-plugin = "2.7.1"
tauri-plugin-opener = "2.7.0"
# The app registers single-instance itself (it must be the first plugin);
# listed here so the example and the plugin's tests share one version.
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Default features off to choose the TLS stack; `system-proxy` keeps corporate
# proxies working (Chromium-based ow-electron honours them), `http2` and
# `charset` restore the remaining defaults.
reqwest = { version = "0.13.5", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "http2",
  "charset",
] }
url = "2"
semver = "1"
sha1_smol = "1"
sha2 = "0.11"
md5 = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
log = "0.4"
# Timers and one-shot replies inside the plugin; tauri already depends on
# tokio, so this adds no new crate, only the `time` feature.
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }
sys-locale = "0.3"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_Foundation"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
# Pedantic is on for the whole workspace. Any `#[allow(clippy::...)]` must
# carry a comment that justifies it (CONTRIBUTING.md, "Lint exceptions").
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
