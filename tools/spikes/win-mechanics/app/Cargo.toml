# W0c spike B app. The app itself asks for plain tauri (no `unstable`);
# `unstable` arrives only through spike-miniplugin's renamed dependency (B7).
[package]
name = "win-mechanics-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
spike-miniplugin = { path = "../miniplugin" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Same versions wry 0.57 uses (instrumentation). B8 (the cross-minor re-wrap)
# lives in its own crate (../b8-rewrap) so its link question cannot break the
# B1-B6 probes.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
