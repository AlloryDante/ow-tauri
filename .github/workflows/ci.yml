name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # The upstream sample still lists @overwolf/ow-electron until its port lands;
  # CI never runs Electron, so skip the binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-features --locked
      - name: doc
        run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: Rust MSRV 1.90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Install Rust 1.90
        run: rustup toolchain install 1.90 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: check
        env:
          RUSTFLAGS: ''
        run: cargo +1.90 check --workspace --all-features --locked

  node:
    name: TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Switch to `npm ci` once package-lock.json is committed (see CONTRIBUTING.md).
      - name: install
        run: npm install --no-audit --no-fund
      - name: format
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: docs
        run: npm run docs

  example:
    name: Example build (${{ matrix.os }})
    needs: [rust, node]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip until the Tauri port of the example exists
        id: gate
        shell: bash
        run: |
          if [ -f examples/packages-sample/src-tauri/Cargo.toml ]; then
            echo "ported=true" >> "$GITHUB_OUTPUT"
          else
            echo "examples/packages-sample has no src-tauri yet; skipping."
            echo "ported=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Linux system dependencies (WebKitGTK 4.1)
        if: steps.gate.outputs.ported == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ported == 'true'
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.ported == 'true'
      - name: install
        if: steps.gate.outputs.ported == 'true'
        run: npm install --no-audit --no-fund
      - name: build frontend and Rust app (no bundling, no launch)
        if: steps.gate.outputs.ported == 'true'
        run: |
          npm run build --workspace ow-tauri
          npm run build --workspace examples/packages-sample
          cargo build --manifest-path examples/packages-sample/src-tauri/Cargo.toml --locked
