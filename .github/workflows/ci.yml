name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: newest stable Rust + newest tauri 2.x, and the liveness soak.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # The upstream sample still lists @overwolf/ow-electron until its port lands;
  # CI never runs Electron, so skip the binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

# Third-party actions are pinned by commit SHA (tag in the trailing comment);
# Dependabot keeps them current (.github/dependabot.yml).

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system dependencies (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: clippy (build-dependency feature sets of the plugin)
        shell: bash
        run: |
          cargo clippy -p tauri-plugin-overwolf --all-targets --no-default-features --locked -- -D warnings
          cargo clippy -p tauri-plugin-overwolf --all-targets --no-default-features --features embed-resource --locked -- -D warnings
      # --all-features turns on test-util, whose hooks use code that an app's
      # build never reaches; check the library as an app (and the lab) builds it.
      - name: clippy (the plugin library as an app builds it)
        shell: bash
        run: |
          cargo clippy -p tauri-plugin-overwolf --lib --locked -- -D warnings
          cargo clippy -p tauri-plugin-overwolf --lib --features lab --locked -- -D warnings
      # Doctests run per package: rustdoc links them with every native search
      # path of the whole build, and on Windows the ACL test app's tauri-build
      # output (a placeholder msvcrt.lib for the static C runtime) breaks
      # links that are not its own.
      - name: test
        run: cargo test --workspace --all-targets --all-features --locked
      - name: doctests
        run: cargo test -p tauri-plugin-overwolf --doc --all-features --locked
      # The Safari version test passes when Safari is absent; on the macOS
      # runner Safari is installed, so require the read and log its result.
      - name: Safari version is read (macOS)
        if: runner.os == 'macOS'
        env:
          OW_TAURI_EXPECT_SAFARI: '1'
        run: cargo test -p tauri-plugin-overwolf --lib --all-features --locked platform::tests::safari_version_is_read -- --exact --nocapture
      - name: doc
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: mingw-w64 (GNU cross-link of the OWE resource)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      # CONTRACT G.4 c: the OWEINTEGRITY/OWE resource links next to the
      # VERSIONINFO that tauri-build writes, with MSVC (native, Windows) and
      # with GNU (mingw-w64 cross from Linux), in a release build that applies
      # a signed fixture. Versions are pinned: the fixture has no lockfile.
      - name: OWEINTEGRITY/OWE resource links next to a VERSIONINFO (MSVC and GNU)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          uid=djpddhibpjddgdpcfkbooljealnjnamkhlihgbab
          if [ "$RUNNER_OS" = "Windows" ]; then
            plugin="$(cygpath -m "$GITHUB_WORKSPACE/crates/tauri-plugin-overwolf")"
            target=x86_64-pc-windows-msvc
          else
            plugin="$GITHUB_WORKSPACE/crates/tauri-plugin-overwolf"
            target=x86_64-pc-windows-gnu
            export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          fi
          dir="$RUNNER_TEMP/owe-link"
          mkdir -p "$dir/src" "$dir/ow-tauri-signed"
          cat > "$dir/Cargo.toml" <<EOF
          [package]
          name = "owe-link"
          version = "1.0.0"
          edition = "2024"
          [workspace]
          [build-dependencies]
          tauri-plugin-overwolf = { path = "$plugin", default-features = false, features = ["embed-resource"] }
          embed-resource = "=3.0.12"
          tauri-winres = "=0.3.6"
          EOF
          echo 'fn main() {}' > "$dir/src/main.rs"
          cat > "$dir/build.rs" <<'EOF'
          fn main() {
              tauri_plugin_overwolf::build::embed_manifest("package.json").unwrap();
              // A VERSIONINFO as tauri-build writes one, in its own .res.
              let mut res = tauri_winres::WindowsResource::new();
              res.set("FileDescription", "owe-link");
              res.compile().unwrap();
          }
          EOF
          echo '{"name":"owe-link","version":"1.0.0","author":"CI"}' > "$dir/package.json"
          echo "{\"name\":\"owe-link\",\"version\":\"1.0.0\",\"author\":\"CI\",\"overwolf\":{\"uid\":\"$uid\"}}" > "$dir/ow-tauri-signed/package.json"
          cargo build --release --target "$target" --manifest-path "$dir/Cargo.toml"
          exe="$dir/target/$target/release/owe-link.exe"
          # Resource type names are stored as UTF-16LE in the PE resource
          # directory; the data is the JSON as written.
          LC_ALL=C grep -q -a -P 'O\x00W\x00E\x00I\x00N\x00T\x00E\x00G\x00R\x00I\x00T\x00Y\x00' "$exe"
          LC_ALL=C grep -q -a -P 'V\x00S\x00_\x00V\x00E\x00R\x00S\x00I\x00O\x00N\x00_\x00I\x00N\x00F\x00O\x00' "$exe"
          grep -q -a "{\"appUid\":\"$uid\"}" "$exe"
          if [ "$RUNNER_OS" = "Windows" ]; then
            readobj="$(command -v llvm-readobj || echo '/c/Program Files/LLVM/bin/llvm-readobj.exe')"
            "$readobj" --coff-resources "$exe" | tee "$dir/resources.txt"
            grep -q 'OWEINTEGRITY' "$dir/resources.txt"
          fi

  msrv:
    name: Rust MSRV 1.90
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system dependencies (Tauri prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust 1.90
        run: rustup toolchain install 1.90 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: check
        env:
          RUSTFLAGS: ''
        run: cargo +1.90 check --workspace --all-features --locked

  node:
    name: TypeScript (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # The npm workspaces are packages/* (api, cli, guest-shims); the
      # examples and the parity harness rejoin them in W3/W4.
      - name: install
        run: npm ci --no-audit --no-fund
      - name: format
        run: npm run format:check
      - name: lint (incl. no Node imports in tauri-plugin-overwolf-api)
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test (with coverage thresholds)
        run: npm run test:coverage
      - name: docs
        run: npm run docs
      - name: generated scripts match their sources (crates/tauri-plugin-overwolf/js, api-iife.js)
        if: runner.os == 'Linux'
        run: npm run check:generated
      - name: published packages (publint, are-the-types-wrong)
        if: runner.os == 'Linux'
        run: npm run check:packages

  docs-links:
    name: Docs links
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Node built-ins only: no install step.
      - name: relative links and anchors in every Markdown file
        run: node scripts/check-links.mjs

  supply-chain:
    name: Supply chain
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The cargo-deny container ships its own default toolchain; install the
      # one rust-toolchain.toml pins up front, so the container's rustup does
      # not have to recover from a missing override toolchain.
      - name: Toolchain channel (from rust-toolchain.toml)
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{ steps.toolchain.outputs.channel }}
          command: check advisories bans licenses sources
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: npm audit (the workspaces and the workspace root)
        run: npm audit --audit-level=high --workspaces --include-workspace-root
      - name: Overwolf packages are on the latest dist-tag
        run: node scripts/check-overwolf-dist-tags.mjs

  example:
    name: Example build (${{ matrix.os }})
    # restored in W3/W4: the examples build on the removed packages/ow-tauri
    # until their port to tauri-plugin-overwolf-api lands.
    if: false && github.event_name != 'schedule'
    needs: [rust, node]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip until the Tauri port of the example exists
        id: gate
        shell: bash
        run: |
          if [ -f examples/packages-sample/src-tauri/Cargo.toml ]; then
            echo "ported=true" >> "$GITHUB_OUTPUT"
          else
            echo "examples/packages-sample has no src-tauri yet; skipping."
            echo "ported=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Linux system dependencies (Tauri prerequisites)
        if: steps.gate.outputs.ported == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.ported == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.gate.outputs.ported == 'true'
      - name: install
        if: steps.gate.outputs.ported == 'true'
        run: npm ci --no-audit --no-fund
      # restored in W3/W4 (job disabled above): builds the removed ow-tauri package.
      - name: build frontend and Rust app (no bundling, no launch)
        if: steps.gate.outputs.ported == 'true'
        run: |
          npm run build --workspace ow-tauri
          npm run build --workspace examples/packages-sample
          cargo build --manifest-path examples/packages-sample/src-tauri/Cargo.toml --locked
      - name: packages sample Rust app lints (with and without the lab)
        if: steps.gate.outputs.ported == 'true'
        shell: bash
        run: |
          cargo fmt --manifest-path examples/packages-sample/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path examples/packages-sample/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path examples/packages-sample/src-tauri/Cargo.toml --all-targets --features lab --locked -- -D warnings
      - name: ad showcase (lint, types, unit tests, both stages, Rust app with and without the lab)
        if: steps.gate.outputs.ported == 'true'
        shell: bash
        run: |
          npm run lint --workspace examples/ad-showcase
          npm run typecheck --workspace examples/ad-showcase
          npm test --workspace examples/ad-showcase
          npm run build --workspace examples/ad-showcase
          cargo fmt --manifest-path examples/ad-showcase/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path examples/ad-showcase/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path examples/ad-showcase/src-tauri/Cargo.toml --all-targets --features lab --locked -- -D warnings

  latest:
    name: Newest stable Rust + newest tauri 2.x (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system dependencies (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Newest stable Rust (overrides rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - name: Update every dependency to its newest compatible release
        run: cargo update
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test (doctests per package, see the rust job)
        shell: bash
        run: |
          cargo test --workspace --all-targets --all-features
          cargo test -p tauri-plugin-overwolf --doc --all-features

  soak:
    name: Main webview liveness soak (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip until the soak test exists (CONTRACT A.6)
        id: gate
        shell: bash
        run: |
          if [ -f crates/tauri-plugin-overwolf/tests/liveness_soak.rs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No liveness soak test yet; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Linux system dependencies (Tauri prerequisites + Xvfb)
        if: steps.gate.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.gate.outputs.present == 'true'
      - name: soak (test ads only; no network ads are loaded)
        if: steps.gate.outputs.present == 'true'
        shell: bash
        env:
          OW_TAURI_TEST_AD: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo test -p tauri-plugin-overwolf --test liveness_soak --locked -- --ignored --nocapture
          else
            cargo test -p tauri-plugin-overwolf --test liveness_soak --locked -- --ignored --nocapture
          fi
